# 專案名稱
spring.application.name=smart-order-assistant-system

# 載入專案根目錄的 .env，並以 properties 格式解析
spring.config.import=optional:file:.env[.properties]

# MySQL 資料庫連線設定
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:${DB_PORT:3306}/${DB_NAME:smart_order_assistant_db}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Taipei}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MySQL 登入帳號與密碼
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Flyway 資料庫版本管理
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JPA 設定
# 開發階段自動更新資料表結構
# Hibernate 驗證
spring.jpa.hibernate.ddl-auto=validate

# 顯示 SQL 執行語句
# 把 Hibernate 執行的 SQL 印到 console
spring.jpa.show-sql=true

# 把印出來的 SQL 排版，變得比較好讀
spring.jpa.properties.hibernate.format_sql=true


